version: 2

models:
  - name: silver_yellow_taxi_trips
    columns:
      - name: overall_trip_quality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - VALID
                  - INCOMPLETE
                  - REVIEW
                  - SUSPICIOUS
                  - HIGHLY_SUSPICIOUS
                  - INVALID